name: PDK regression

on:
  push:
    # mc-realism: the MC realism program branch (v2.3-stats); remove at close-out
    # once it has merged to main.
    branches: [main, mc-realism]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned simulator. Matches the local development baseline (ngspice-45, Qucs-S
  # bundle) that the goldens and the Monte Carlo seeding evidence were produced on.
  NGSPICE_VERSION: "45"

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Build the pinned ngspice from source. Ubuntu 24.04's apt package is an
      # older release (~41-42); Phase C diffs against goldens generated on 45, and
      # the native Monte Carlo seeding behaviour (docs/backlog/HANDOFF_monte_carlo.md
      # C2-C5b) was measured on 45 only. The install is cached by version, so only
      # the first run after a version bump pays the compile.
      - name: Cache ngspice build
        id: ngspice-cache
        uses: actions/cache@v4
        with:
          path: ~/ngspice
          key: ngspice-${{ env.NGSPICE_VERSION }}-ubuntu-24.04-v1

      - name: Build ngspice from source
        if: steps.ngspice-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libtool
          curl -fsSL --retry 5 -o ngspice.tar.gz \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz/download"
          tar xzf ngspice.tar.gz
          cd "ngspice-${NGSPICE_VERSION}"
          mkdir release
          cd release
          ../configure --prefix="$HOME/ngspice" --with-x=no --with-readline=no --disable-debug
          make -j"$(nproc)"
          make install

      - name: Put ngspice on PATH
        run: echo "$HOME/ngspice/bin" >> "$GITHUB_PATH"

      # Record the ngspice version this run used, and fail if it is not the pinned
      # one (characterization-inventory item 23: the previous check could not fail).
      - name: Record and assert ngspice version
        run: |
          ngspice --version | grep -i ngspice | head -1 | tee ngspice-version.txt
          grep -Eq "ngspice-${NGSPICE_VERSION}( |$)" ngspice-version.txt

      - name: Pre-flight - device_limits reader (SOA self-consistency + defaults==minima)
        run: python pdk_validation/preflight.py

      - name: Phase A+B - device instantiation smoke (800 ops, ~45 s)
        run: python pdk_validation/regression/run_smoke.py

      - name: Phase C - passive R(V)/C(V) goldens
        run: python pdk_validation/regression/run_passives.py

      - name: Phase D - per-class transients
        run: python pdk_validation/regression/run_transients.py

      - name: P2.2 - corner-sanity check (9 family probes x 5 corners)
        run: python pdk_validation/regression/run_corners.py

      # Phase E is the Monte Carlo *flow* validation, not a regression
      # gate. It involves a statistical comparison (measured sigma vs.
      # intended sigma), so it can occasionally land outside tolerance
      # due to small-N noise. Run it for visibility but never fail the
      # build on it. Use a smaller N to keep CI fast.
      - name: Phase E - Monte Carlo flow (informational)
        continue-on-error: true
        run: |
          python pdk_validation/regression/run_mc.py --axis mm -n 80 --tol 0.40
          python pdk_validation/regression/run_mc.py --axis proc -n 80
